<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Spam Detection</title>
    <style>
/* Global Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* Page Background */
body {
    background-color: #ffffff;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Main Container */
.container {
    width: 100%;
    max-width: 520px;
    padding: 32px;
    border: 1px solid #dcdcdc;
    background-color: #efefef;
}

/* Heading */
.container h1 {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 24px;
    border-bottom: 1px solid #e5e5e5;
    padding-bottom: 12px;
}

/* Form Label */
label {
    font-size: 14px;
    font-weight: 500;
    display: block;
    margin-bottom: 8px;
}

/* Textarea */
textarea {
    width: 100%;
    resize: none;
    padding: 12px;
    font-size: 14px;
    border: 1px solid #bfbfbf;
    outline: none;
    background-color: #ffffff;
}

textarea:focus {
    border-color: #000000;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    background-color: #000000;
    color: #ffffff;
    border: 1px solid #000000;
    cursor: pointer;
    transition: background-color 0.2s ease, color 0.2s ease;
}

button:hover {
    background-color: #ffffff;
    color: #000000;
}

/* Result Text */
#result {
    margin-top: 20px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
}

/* Spam Result */
.spam {
    color: #b00020;
}

/* Safe Result */
.safe {
    color: #006400;
}

    </style>
</head>

<body>
    <div class="container">
        <h1>Email Spam Detection</h1>
        <form id="spamForm">
            <label for="message">Enter your message:</label><br>
            <textarea id="message" name="message" rows="4" cols="50"  required placeholder="Type/paste your mail "></textarea><br><br>
            <button type="submit">Check</button>
        </form>
        <h2 id="result"></h2>
    </div>

    <script>
     // Form submission with auto-clear result and text area after 5 seconds
        document.getElementById('spamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = document.getElementById('message').value;

            try {
                const response = await fetch('https://esd-z761.onrender.com/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const result = await response.json();
                const resultElement = document.getElementById('result');
                if (response.ok) {
                    if (result.prediction === 'spam') {
                        resultElement.innerText = 'This email is classified as SPAM.';
                        resultElement.className = 'spam';
                    } else {
                        resultElement.innerText = 'This email is classified as SAFE.';
                        resultElement.className = 'safe';
                    }
                } else {
                    resultElement.innerText = `Error: ${result.error}`;
                    resultElement.className = '';
                }

                // Clear the result and text area after 5 seconds
                setTimeout(() => {
                    resultElement.innerText = '';
                    resultElement.className = '';
                    document.getElementById('message').value = '';
                }, 5000); // 5000 milliseconds = 5 seconds

            } catch (error) {
                console.error('Error:', error);
                const resultElement = document.getElementById('result');
                resultElement.innerText = 'An error occurred. Check the console for details.';
                resultElement.className = '';

                // Clear the error message and text area after 5 seconds
                setTimeout(() => {
                    resultElement.innerText = '';
                    resultElement.className = '';
                    document.getElementById('message').value = '';
                }, 5000); // 5000 milliseconds = 5 seconds
            }
        });



        document.getElementById('spamForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = document.getElementById('message').value;

            try {
                const response = await fetch('https://esd-z761.onrender.com/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const result = await response.json();
                const resultElement = document.getElementById('result');
                if (response.ok) {
                    if (result.prediction === 'spam') {
                        resultElement.innerText = 'This email is classified as SPAM.';
                        resultElement.className = 'spam';
                    } else {
                        resultElement.innerText = 'This email is classified as SAFE.';
                        resultElement.className = 'safe';
                    }
                } else {
                    resultElement.innerText = `Error: ${result.error}`;
                    resultElement.className = '';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerText = 'An error occurred. Check the console for details.';
            }
        });
    </script>
</body>

</html>
